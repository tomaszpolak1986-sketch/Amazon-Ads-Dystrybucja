# Uruchomienie panelu w Dockerze - trzy kontenery: baza, backend, frontend.
#
#  * Postgres siedzi w kontenerze `db`, dane na wolumenie `pgdata`. Jesli
#    baza juz stoi na hoscie, ustaw DATABASE_URL na host.docker.internal
#    i usun `db` z depends_on.
#  * Frontend wola API pod WLASNYM originem (/api), a serwer Next przekazuje
#    to do kontenera api. Przegladarka nie zna adresu backendu, wiec
#    PANEL_PUBLIC_API_URL zostaje pusty - chyba ze API ma byc wystawione
#    osobno.
#  * Oba serwisy sluchaja tylko na 127.0.0.1; na swiat wypuszcza je dopiero
#    reverse proxy.
#
# Uruchomienie:
#   cp .env.example .env    # i uzupelnic
#   docker compose up -d --build

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: adspanel
      POSTGRES_USER: panel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?ustaw POSTGRES_PASSWORD w .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U panel -d adspanel"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: adspanel-api:latest
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://panel:${POSTGRES_PASSWORD}@db:5432/adspanel}
    depends_on:
      db:
        condition: service_healthy
    extra_hosts:
      # Gdyby baza jednak stala na hoscie (Linux nie ma tego wpisu domyslnie)
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${PANEL_API_PORT:-8010}:8000"
    volumes:
      # Tylko na logi i pliki pomocnicze - dane siedza w Postgresie
      - ./data:/app/data

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        # Pusty = /api pod originem strony (proxy przez Next). Next
        # wkompilowuje to na stale, wiec zmiana wymaga przebudowy.
        NEXT_PUBLIC_API_URL: ${PANEL_PUBLIC_API_URL:-}
        # Dokad serwer Next przekazuje /api - adres kontenera, nie hosta
        API_INTERNAL_URL: ${PANEL_API_INTERNAL_URL:-http://api:8000}
    image: adspanel-web:latest
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "127.0.0.1:${PANEL_WEB_PORT:-3010}:3000"

volumes:
  pgdata:
